name: Enable GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site from main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "create_http:${code}"
          cat /tmp/pages.json
          echo
          case "${code}" in
            201|409) exit 0 ;;
          esac
          get=$(curl -sS -o /tmp/get.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "get_http:${get}"
          cat /tmp/get.json
          echo
          test "${get}" = "200"
